<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ефемериди</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 30px;
      background: #fff;
      color: #2c3e50;
    }
    .header {
      display: flex;
      align-items: center;
      border-bottom: 2px solid #ddd;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    .header img {
      height: 70px;
      margin-right: 20px;
    }
    .header-text h1 {
      font-size: 20px;
      margin: 0 0 6px;
      font-weight: 600;
    }
    .header-text p {
      margin: 0;
      font-size: 14px;
      color: #555;
    }
    #report-title {
      font-size: 22px;
      margin: 0 0 25px;
    }
    h3 {
      margin: 30px 0 10px;
      font-size: 18px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 10px;
      text-align: center;
      border: 1px solid #ddd;
    }
    th {
      background: #34495E;
      color: #ECF0F1;
      font-weight: 600;
    }
    tr:nth-child(even) {
      background: #F7F9FA;
    }
    .footer {
      margin-top: 50px;
      font-size: 12px;
      text-align: center;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="https://i.postimg.cc/DZh0SV41/image.png" alt="Логотип">
    <div class="header-text">
      <h1>Міжнародний інститут прикладної астрології, парапсихології та досліджень аномальних явищ Е-ТЕРРА</h1>
      <p><a href="https://e-terra.com.ua" target="_blank">https://e-terra.com.ua</a></p>
    </div>
  </div>

  <h2 id="report-title">Ефемериди</h2>
  <div id="ephemerides-content">Завантаження…</div>

  <div class="footer">
    Розрахунки на основі даних НАСА.<br>
    Інститут Е-ТЕРРА, © 2025
  </div>

  <script>
  (async function() {
    const params = new URLSearchParams(window.location.search);
    const ru = params.get("lang") === "ru";
    const words = ru ? {
      title:'Эфемериды', organization:'Международный институт прикладной астрологии, парапсихологии и исследований аномальных явлений Е-ТЕРРА',
      loading:'Загрузка…', footer:'Расчёты на основе данных НАСА.', institute:'Институт Е-ТЕРРА, © 2025', invalid:'Неверные параметры', pass:'Передайте в URL: city, start, end, time',
      report:(c,s,e,t)=>`Эфемериды для ${c} с ${s} по ${e} (${t})`, notFound:c=>`Город «${c}» не найден`, sidereal:'Сидерическое время:', longitude:'Долгота°', between:'Между', angle:'Угол°'
    } : {
      title:'Ефемериди', organization:'Міжнародний інститут прикладної астрології, парапсихології та досліджень аномальних явищ Е-ТЕРРА',
      loading:'Завантаження…', footer:'Розрахунки на основі даних НАСА.', institute:'Інститут Е-ТЕРРА, © 2025', invalid:'Неправильні параметри', pass:'Передайте в URL: city, start, end, time',
      report:(c,s,e,t)=>`Ефемериди для ${c} з ${s} по ${e} (${t})`, notFound:c=>`Місто «${c}» не знайдено`, sidereal:'Сидеричний час:', longitude:'Довгота°', between:'Між', angle:'Кут°'
    };
    document.documentElement.lang = ru ? 'ru' : 'uk';
    document.title = words.title;
    document.querySelector('.header-text h1').textContent=words.organization;
    const site=document.querySelector('.header-text a');
    if(ru){site.href='https://ru.e-terra.com.ua';site.textContent=site.href;}
    document.getElementById('ephemerides-content').textContent=words.loading;
    const footer=document.querySelector('.footer');
    footer.replaceChildren(document.createTextNode(words.footer),document.createElement('br'),document.createTextNode(words.institute));
    const escapeText = value => String(value).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const city  = params.get("city")  || "";
    const start = params.get("start") || "";
    const end   = params.get("end")   || "";
    const time  = params.get("time")  || "";
    const titleEl = document.getElementById("report-title");
    const content = document.getElementById("ephemerides-content");

    if (!city || !start || !end || !time) {
      titleEl.innerText = words.invalid;
      content.textContent = words.pass;
      return;
    }

    titleEl.innerText = words.report(city,start,end,time);
    content.innerHTML = "";

    const PLANET_NAMES = {
      Sun:'Сонце', Moon:'Місяць', Mercury:'Меркурій', Venus:'Венера',
      Mars:'Марс', Jupiter:'Юпітер', Saturn:'Сатурн', Uranus:'Уран',
      Neptune:'Нептун', Pluto:'Плутон'
    };
    if(ru) Object.assign(PLANET_NAMES, {
      Sun:'Солнце', Moon:'Луна', Mercury:'Меркурий', Venus:'Венера', Mars:'Марс', Jupiter:'Юпитер', Saturn:'Сатурн', Uranus:'Уран', Neptune:'Нептун', Pluto:'Плутон',
      'Сонце':'Солнце','Місяць':'Луна','Меркурій':'Меркурий','Юпітер':'Юпитер', Lilith:'Лилит', Selena:'Селена', 'True Node':'Истинный узел'
    });
    const ASPECT_NAMES = {
      conjunction:'з’єднання', opposition:'опозиція',
      trine:'трин', square:'квадратура', sextile:'секстиль'
    };
    if(ru) Object.assign(ASPECT_NAMES,{conjunction:'соединение',opposition:'оппозиция',trine:'трин',square:'квадратура',sextile:'секстиль'});
    const SIGNS = ru ? ['Овен','Телец','Близнецы','Рак','Лев','Дева','Весы','Скорпион','Стрелец','Козерог','Водолей','Рыбы'] : ['Овен','Телець','Близнюки','Рак','Лев','Діва','Терези','Скорпіон','Стрілець','Козоріг','Водолій','Риби'];

    // Геокодинг
    let places = [];
    try {
      places = await fetch(
        `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(city)}`
      ).then(r => r.json());
    } catch (e) {}
    if (!places.length) {
      content.textContent = words.notFound(city);
      return;
    }
    const { lat, lon } = places[0];

    // Запрос эфемерид по дням
    const ds = new Date(start), de = new Date(end);
    for (let d = new Date(ds); d <= de; d.setDate(d.getDate()+1)) {
      const date = d.toISOString().split('T')[0];
      const loc = new Date(`${date}T${time}`);
      const utc = new Date(loc.getTime() + loc.getTimezoneOffset()*60000);
      const tp = [utc.getUTCHours(), utc.getUTCMinutes(), utc.getUTCSeconds()]
        .map(n => String(n).padStart(2,'0')).join(':');

      const [Y,M,D] = date.split('-');
      const apiUrl = `https://ephemerides-api-1.onrender.com/ephemerides`
        + `?year=${Y}&month=${M}&day=${D}&time=${tp}&lat=${lat}&lon=${lon}`;
      let data;
      try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw await res.text();
        data = await res.json();
      } catch (err) {
        content.innerHTML += `<h3>${date}</h3><p style="color:red;">${escapeText(err)}</p>`;
        continue;
      }

      // Рендерим день
      let html = `<h3>${date}</h3>`;
      const st = data.sidereal_time;
      const H = Math.floor(st),
            m = Math.floor((st - H) * 60),
            s = Math.round((st - H) * 3600 - m * 60);
      html += `<p><strong>${words.sidereal}</strong> ${H}ч ${m}м ${s}с; `
           + `<strong>ASC:</strong> ${data.asc?.toFixed(2)||'-'}°; `
           + `<strong>MC:</strong> ${data.mc?.toFixed(2)||'-'}°</p>`;

      // Таблица планет
      html += `<table><thead><tr><th>Планета</th><th>${words.longitude}</th><th>Знак</th></tr></thead><tbody>`;
      for (const [pl, lonVal] of Object.entries(data.positions)) {
        const nameUa = PLANET_NAMES[pl] || pl;
        const idx = Math.floor((lonVal % 360) / 30);
        const deg = (lonVal % 30).toFixed(2);
        html += `<tr><td>${nameUa}</td><td>${lonVal.toFixed(2)}</td><td>${SIGNS[idx]} ${deg}°</td></tr>`;
      }
      html += `</tbody></table>`;

      // Таблица аспектов
      html += `<table><thead><tr><th>Аспект</th><th>${words.between}</th><th>${words.angle}</th></tr></thead><tbody>`;
      for (const a of data.aspects) {
        const aspectUa = ASPECT_NAMES[String(a.aspect).toLowerCase()] || a.aspect;
        const betweenUa = a.between.map(x => PLANET_NAMES[x] || x).join(' – ');
        html += `<tr><td>${aspectUa}</td><td>${betweenUa}</td><td>${a.angle.toFixed(2)}</td></tr>`;
      }
      html += `</tbody></table>`;

      content.innerHTML += html;
    }
  })();
  </script>
</body>
</html>
